events { 
    worker_connections 1024; 
}

http {
    upstream streaming_backend {
        server streaming-server-1:11470 max_fails=3 fail_timeout=5s;
        server streaming-server-2:11470 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;

        # Frontend UI Route
        location / {
            proxy_pass http://stremio-web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Torrentio Scraper API Route
        location /torrentio/ {
            rewrite ^/torrentio/(.*) /$1 break;
            proxy_pass http://torrentio-scraper:7000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Streaming Server Route with Multi-Server Failover
        location /stream/ {
            proxy_pass http://streaming_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Direct Remux-to-MP4 Download Tunnel Route
        location /download/ {
            proxy_pass http://remux-service:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
