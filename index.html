<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Platform</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0b0e;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Top Bar for custom stream controls if needed */
        .top-bar {
            height: 45px;
            background: #12141c;
            border-bottom: 1px solid #2a2e3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            color: #9ca3af;
            font-size: 13px;
            flex-shrink: 0;
        }

        .top-bar span {
            color: #fff;
            font-weight: 600;
        }

        .stremio-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 45px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div><span>VERGA Portal</span> — Powered by Stremio Web</div>
        <div>Catalog & Addons Active</div>
    </div>

    <div class="stremio-container">
        <iframe src="https://web.strem.io/" allowfullscreen></iframe>
    </div>

</body>
</html>
