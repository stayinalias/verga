<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERGA - Stremio Multi-Stream Portal</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #151821;
            --border-color: #282d3c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Top Integrated Banner */
        .top-banner {
            height: 56px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            gap: 12px;
            z-index: 1000;
            flex-shrink: 0;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .brand span {
            color: var(--accent);
        }

        /* Live Title-to-IMDb Search Box */
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 320px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-results-dropdown {
            position: absolute;
            top: 42px;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 350px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: none;
            z-index: 2000;
        }

        .result-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .result-item:hover {
            background: #1e2230;
        }

        .result-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .result-info img {
            width: 32px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            background: #282d3c;
            flex-shrink: 0;
        }

        .result-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .result-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .imdb-tag-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0b0c10;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .imdb-tag {
            font-size: 11px;
            font-weight: 700;
            color: #f5c518; /* Official IMDb Yellow */
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 0 2px;
            display: flex;
            align-items: center;
        }

        .copy-btn:hover {
            color: #fff;
        }

        /* Controls Section */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, input, button {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        select {
            cursor: pointer;
            background-color: #1a1e2b;
            font-weight: 600;
        }

        input[type="text"].id-input {
            width: 120px;
        }

        input[type="number"] {
            width: 55px;
        }

        button.btn-play {
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 700;
            padding: 7px 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button.btn-play:hover {
            background: var(--accent-hover);
        }

        /* Portal Container & Overlays */
        .portal-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 56px);
            position: relative;
        }

        iframe.stremio-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 3000;
            display: none;
            flex-direction: column;
        }

        .player-bar {
            height: 44px;
            background: #11131a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .close-player-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        iframe.stream-frame {
            width: 100%;
            height: calc(100% - 44px);
            border: none;
        }
    </style>
</head>

        <div class="brand"><span>VERGA</span> STREMIO</div>
