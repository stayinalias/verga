<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERGA - Stremio Multi-Stream Portal</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #151821;
            --border-color: #282d3c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Top Integrated Banner */
        .top-banner {
            height: 56px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            gap: 12px;
            z-index: 1000;
            flex-shrink: 0;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .brand span {
            color: var(--accent);
        }

        /* Live Title-to-IMDb Search Box */
        .search-wrapper {
            position: relative;
            flex-grow: 1;
            max-width: 320px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-results-dropdown {
            position: absolute;
            top: 42px;
            left: 0;
            right: 0;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 350px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: none;
            z-index: 2000;
        }

        .result-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .result-item:hover {
            background: #1e2230;
        }

        .result-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .result-info img {
            width: 32px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            background: #282d3c;
            flex-shrink: 0;
        }

        .result-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .result-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .imdb-tag-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0b0c10;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .imdb-tag {
            font-size: 11px;
            font-weight: 700;
            color: #f5c518; /* Official IMDb Yellow */
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 0 2px;
            display: flex;
            align-items: center;
        }

        .copy-btn:hover {
            color: #fff;
        }

        /* Controls Section */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, input, button {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        select {
            cursor: pointer;
            background-color: #1a1e2b;
            font-weight: 600;
        }

        input[type="text"].id-input {
            width: 120px;
        }

        input[type="number"] {
            width: 55px;
        }

        button.btn-play {
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 700;
            padding: 7px 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button.btn-play:hover {
            background: var(--accent-hover);
        }

        /* Portal Container & Overlays */
        .portal-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 56px);
            position: relative;
        }

        iframe.stremio-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 3000;
            display: none;
            flex-direction: column;
        }

        .player-bar {
            height: 44px;
            background: #11131a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .close-player-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        iframe.stream-frame {
            width: 100%;
            height: calc(100% - 44px);
            border: none;
        }
    </style>
</head>
<body>

    <!-- Top Banner -->
    <div class="top-banner">
        <div class="brand"><span>VERGA</span> STREMIO</div>
        
        <!-- Live Movie Title to IMDb ID Search -->
        <div class="search-wrapper">
            <input type="text" id="titleSearchInput" class="search-input" placeholder="Search Movie Title (e.g. Spiderman brand new day)..." oninput="debounceSearch()">
            <div id="searchResults" class="search-results-dropdown"></div>
        </div>

        <div class="controls-bar">
            <select id="serverSelect">
                <option value="0">Server 1 (VidSrc.cc)</option>
                <option value="1">Server 2 (VidSrc.to)</option>
                <option value="2">Server 3 (VidSrc.su)</option>
                <option value="3">Server 4 (VidLink Pro)</option>
                <option value="4">Server 5 (MultiEmbed)</option>
                <option value="5">Server 6 (AutoEmbed)</option>
                <option value="6">Server 7 (MoviesAPI)</option>
                <option value="7">Server 8 (2Embed)</option>
                <option value="8">Server 9 (VidFast)</option>
                <option value="9">Server 10 (VidSrc VIP)</option>
            </select>

            <input type="text" id="imdbIdInput" class="id-input" placeholder="IMDb ID" value="tt22084616">
            <input type="number" id="seasonInput" placeholder="S" min="1">
            <input type="number" id="episodeInput" placeholder="Ep" min="1">

            <button class="btn-play" onclick="playInAppStream()">▶ Stream</button>
            <button class="btn-play" style="background:#282d3c;" onclick="loadInStremio()">🔍 Load Stremio</button>
        </div>
    </div>

    <!-- Main View -->
    <div class="portal-container">
        <iframe id="stremioFrame" class="stremio-frame" src="https://web.strem.io/#/" allowfullscreen></iframe>

        <!-- In-App Stream Player Overlay -->
        <div class="player-overlay" id="playerOverlay">
            <div class="player-bar">
                <span id="playerStatus" style="font-size: 13px; font-weight: 600;">Active Stream Player</span>
                <button class="close-player-btn" onclick="closeStreamPlayer()">✕ Close Player</button>
            </div>
            <iframe id="streamPlayerFrame" class="stream-frame" allow="fullscreen; autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <script>
        const streamProviders = [
            (id, s, e) => s ? `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}` : `https://vidsrc.cc/v2/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.su/embed/tv/${id}/${s}/${e}` : `https://vidsrc.su/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidlink.pro/tv/${id}/${s}/${e}` : `https://vidlink.pro/movie/${id}`,
            (id, s, e) => `https://multiembed.mov/?video_id=${id}${s ? `&s=${s}&e=${e}` : ''}`,
            (id, s, e) => `https://player.autoembed.cc/embed/movie/${id}`,
            (id, s, e) => s ? `https://moviesapi.club/tv/${id}-${s}-${e}` : `https://moviesapi.club/movie/${id}`,
            (id, s, e) => s ? `https://www.2embed.stream/embed/tv/${id}/${s}/${e}` : `https://www.2embed.stream/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidfast.pro/embed/tv/${id}/${s}/${e}` : `https://vidfast.pro/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.vip/embed/tv/${id}/${s}/${e}` : `https://vidsrc.vip/embed/movie/${id}`
        ];

        let searchTimer = null;

        function debounceSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(performMovieSearch, 300);
        }

        // Fetches movie titles and IMDb IDs dynamically via Stremio/Cinemeta catalog API
        async function performMovieSearch() {
            const query = document.getElementById('titleSearchInput').value.trim();
            const resultsBox = document.getElementById('searchResults');

            if (!query) {
                resultsBox.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${encodeURIComponent(query)}.json`);
                const data = await res.json();

                if (!data.metas || data.metas.length === 0) {
                    resultsBox.innerHTML = `<div style="padding:12px; font-size:12px; color:var(--text-muted);">No matching movies found</div>`;
                    resultsBox.style.display = 'block';
                    return;
                }

                resultsBox.innerHTML = data.metas.slice(0, 6).map(m => `
                    <div class="result-item" onclick="selectMovie('${m.id}', '${m.name.replace(/'/g, "\\'")}')">
                        <div class="result-info">
                            <img src="${m.poster || ''}" alt="">
                            <div class="result-details">
                                <span class="result-title">${m.name}</span>
                                <span class="result-meta">${m.releaseInfo || m.year || 'Movie'}</span>
                            </div>
                        </div>
                        <div class="imdb-tag-container" onclick="event.stopPropagation()">
                            <span class="imdb-tag">${m.id}</span>
                            <button class="copy-btn" title="Copy IMDb ID" onclick="copyToClipboard('${m.id}', this)">📋</button>
                        </div>
                    </div>
                `).join('');

                resultsBox.style.display = 'block';
            } catch (err) {
                console.error("Search fetch error:", err);
            }
        }

        function copyToClipboard(imdbId, btnElement) {
            navigator.clipboard.writeText(imdbId).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "✓";
                setTimeout(() => { btnElement.innerText = originalText; }, 1200);
            });
        }

        function selectMovie(imdbId, title) {
            document.getElementById('imdbIdInput').value = imdbId;
            document.getElementById('titleSearchInput').value = title;
            document.getElementById('searchResults').style.display = 'none';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });

        function loadInStremio() {
            const rawId = document.getElementById('imdbIdInput').value.trim();
            if (!rawId) return alert("Please select or enter an IMDb ID");

            const formattedId = rawId.startsWith('tt') ? rawId : `tt${rawId}`;
            const season = document.getElementById('seasonInput').value;
            const episode = document.getElementById('episodeInput').value;

            let stremioUrl = (season && episode) 
                ? `https://web.strem.io/#/detail/series/${formattedId}/${formattedId}%3A${season}%3A${episode}`
                : `https://web.strem.io/#/detail/movie/${formattedId}/${formattedId}`;

            document.getElementById('stremioFrame').src = stremioUrl;
        }

        function playInAppStream() {
            const rawId = document.getElementById('imdbIdInput').value.trim();
            if (!rawId) return alert("Please select or enter an IMDb ID");

            const formattedId = rawId.startsWith('tt') ? rawId : `tt${rawId}`;
            const serverIdx = parseInt(document.getElementById('serverSelect').value);
            const season = document.getElementById('seasonInput').value;
            const episode = document.getElementById('episodeInput').value;

            const targetUrl = streamProviders[serverIdx](formattedId, season, episode);

            document.getElementById('playerStatus').innerText = `Streaming ${formattedId} on Server ${serverIdx + 1}`;
            document.getElementById('streamPlayerFrame').src = targetUrl;
            document.getElementById('playerOverlay').style.display = 'flex';
        }

        function closeStreamPlayer() {
            document.getElementById('streamPlayerFrame').src = 'about:blank';
            document.getElementById('playerOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
