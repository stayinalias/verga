<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Addon & Streaming Portal</title>
    <style>
        :root {
            --bg-dark: #0f1117;
            --bg-card: #181a20;
            --bg-header: #13151b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2a2d3d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        header {
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: sticky; top: 0; z-index: 100;
        }

        .brand { font-size: 20px; font-weight: 700; color: #fff; }
        .brand span { color: var(--accent); }

        .search-box {
            display: flex; gap: 8px; flex-grow: 1; max-width: 500px;
        }

        input, select, button {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"] { flex-grow: 1; }

        button.btn-primary {
            background: var(--accent); border: none; color: white; font-weight: 600; cursor: pointer;
        }
        button.btn-primary:hover { background: var(--accent-hover); }

        main { padding: 30px; max-width: 1400px; margin: 0 auto; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            overflow: hidden; cursor: pointer; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-title { padding: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Stream Modal */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            max-width: 700px; width: 100%; padding: 25px; position: relative;
        }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        .stream-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .stream-item {
            background: var(--bg-dark); border: 1px solid var(--border); padding: 12px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .stream-item:hover { border-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span>VERGA</span> Stremio Portal</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search movies or IMDb ID (e.g. tt1375666)...">
            <button class="btn-primary" onclick="searchMedia()">Search</button>
        </div>
        <a href="https://web.stremio.com" target="_blank" class="btn-primary" style="text-decoration:none; padding: 9px 14px; border-radius: 6px; font-size: 14px;">Open Official Stremio Web</a>
    </header>

    <main>
        <h2 id="catalogTitle">Popular Stremio Catalog</h2>
        <div class="grid" id="movieGrid"></div>
    </main>

    <div class="modal" id="streamModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalMediaTitle">Movie Title</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">Select a stream server below to play:</p>
            
            <div class="stream-list" id="streamList"></div>
        </div>
    </div>

    <script>
        const defaultMovies = [
            { id: "tt1375666", title: "Inception", poster: "https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_SX300.jpg" },
            { id: "tt0816692", title: "Interstellar", poster: "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGc@._V1_SX300.jpg" },
            { id: "tt0468569", title: "The Dark Knight", poster: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_SX300.jpg" },
            { id: "tt15398776", title: "Oppenheimer", poster: "https://m.media-amazon.com/images/M/MV5BN2JkMDc5MGQtZGUzMC00NmE5LWEiNGYtMjc3NWJhM2E3N2ExXkEyXkFqcGc@._V1_SX300.jpg" },
            { id: "tt0944947", title: "Game of Thrones", poster: "https://m.media-amazon.com/images/M/MV5BNDgwNzI1NTI1M15BMl5BanBnXkFtZTgwMDM2MDgzTE@._V1_SX300.jpg" },
            { id: "tt0903747", title: "Breaking Bad", poster: "https://m.media-amazon.com/images/M/MV5BMzU5ZGYzNmQtMTdhYy00OGRiLTg0NmQtYjVjNzliZTg1ZGE4XkEyXkFqcGc@._V1_SX300.jpg" }
        ];

        const streamProviders = [
            { name: "Server 1 (VidSrc.cc)", url: id => `https://vidsrc.cc/v2/embed/movie/${id}` },
            { name: "Server 2 (VidSrc.to)", url: id => `https://vidsrc.to/embed/movie/${id}` },
            { name: "Server 3 (VidLink Pro)", url: id => `https://vidlink.pro/movie/${id}` },
            { name: "Server 4 (MultiEmbed)", url: id => `https://multiembed.mov/?video_id=${id}` },
            { name: "Server 5 (AutoEmbed)", url: id => `https://player.autoembed.cc/embed/movie/${id}` },
            { name: "Server 6 (2Embed)", url: id => `https://www.2embed.stream/embed/movie/${id}` },
            { name: "Server 7 (VidSrc VIP)", url: id => `https://vidsrc.vip/embed/movie/${id}` }
        ];

        function renderMovies(list) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = list.map(m => `
                <div class="card" onclick="openStreamSelector('${m.id}', '${m.title.replace(/'/g, "\\'")}')">
                    <img src="${m.poster}" alt="${m.title}">
                    <div class="card-title">${m.title}</div>
                </div>
            `).join('');
        }

        function openStreamSelector(imdbId, title) {
            document.getElementById('modalMediaTitle').innerText = title;
            const container = document.getElementById('streamList');
            
            container.innerHTML = streamProviders.map(p => `
                <div class="stream-item" onclick="launchStream('${p.url(imdbId)}')">
                    <span><strong>${p.name}</strong></span>
                    <button class="btn-primary" style="padding:6px 12px;">▶ Play Stream</button>
                </div>
            `).join('');

            document.getElementById('streamModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('streamModal').style.display = 'none';
        }

        function launchStream(url) {
            const win = window.open(url, '_blank', 'noopener,noreferrer');
            if (win) win.opener = null;
        }

        function searchMedia() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            if (q.startsWith('tt')) {
                openStreamSelector(q, `Media ${q}`);
            } else {
                alert(`Searching for "${q}". Click any card below or enter a direct IMDb ID (tt...) to stream instantly.`);
            }
        }

        renderMovies(defaultMovies);
    </script>
</body>
</html>
