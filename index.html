<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stremio Web Stream Center</title>
    <style>
        :root {
            --bg-dark: #0b0d12;
            --bg-panel: #131722;
            --bg-card: #1a1f2c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2a3142;
            --card-radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: var(--accent);
        }

        .search-container {
            display: flex;
            gap: 8px;
            flex-grow: 1;
            max-width: 550px;
        }

        input[type="text"], input[type="number"], select {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        input[type="text"] {
            flex-grow: 1;
        }

        button.btn-primary {
            background: var(--accent);
            border: none;
            color: white;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button.btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Main Catalog View */
        main {
            padding: 24px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .catalog-title {
            font-size: 18px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .movie-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #252b3b;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Detail & Stream Selector Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover { color: #fff; }

        .modal-content-grid {
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        .modal-poster {
            width: 200px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .modal-details {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-grow: 1;
        }

        .tv-controls {
            display: none;
            gap: 10px;
            margin-top: 5px;
        }

        .tv-controls input {
            width: 90px;
        }

        /* Stream Selector Drawer */
        .stream-section {
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .stream-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .stream-node {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .stream-node:hover {
            border-color: var(--accent);
            background: #212738;
        }

        .stream-badge {
            background: #2e3548;
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        @media (max-width: 650px) {
            .modal-content-grid { flex-direction: column; }
            .modal-poster { width: 100%; height: 220px; }
        }
    </style>
</head>

    <header>
        <div class="brand-logo"><span>VERGA</span> STREMIO</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search movies, TV shows or IMDb ID (tt1375666)...">
            <button class="btn-primary" onclick="handleSearch()">Search</button>
        </div>
    </header>

    <main>
        <div class="catalog-header">
            <h2 class="catalog-title" id="catalogHeading">Trending Catalog</h2>
        </div>
        <div class="grid" id="catalogGrid"></div>
    </main>

    <!-- Detailed Modal & Stream Selector -->
