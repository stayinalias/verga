<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Server Streaming Platform</title>
    <style>
        :root {
            --bg-color: #0a0b0e;
            --panel-bg: #12141c;
            --dropdown-bg: #1a1d28;
            --border-color: #2a2e3d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            height: 70px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 15px;
            flex-shrink: 0;
            box-sizing: border-box;
            z-index: 999;
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"] {
            width: 240px;
        }

        input[type="number"] {
            width: 75px;
        }

        .server-select-wrapper {
            position: relative;
            display: inline-block;
        }

        select.server-dropdown {
            background: var(--dropdown-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 35px 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        select.server-dropdown:hover {
            border-color: var(--accent);
        }

        .server-select-wrapper::after {
            content: "▼";
            font-size: 9px;
            color: var(--text-muted);
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        button.load-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        button.load-btn:hover {
            background: #2563eb;
        }

        .dashboard-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            color: #fff;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="server-select-wrapper">
            <select id="serverSelect" class="server-dropdown">
                <option value="0">Main 1 (VidSrc.cc)</option>
                <option value="1">Main 2 (VidSrc.to)</option>
                <option value="2">Main 3 (VidSrc.su)</option>
                <option value="3">Main 4 (VidLink)</option>
                <option value="4">Main 5 (MultiEmbed)</option>
                <option value="5">Main 6 (AutoEmbed)</option>
                <option value="6">Main 7 (MoviesAPI)</option>
                <option value="7">Main 8 (VidZee)</option>
                <option value="8">Main 9 (2Embed)</option>
                <option value="9">Main 10 (VidFast)</option>
                <option value="10">Multi-language (VidSrc Me)</option>
                <option value="11">Premium embeds (VidSrc VIP)</option>
            </select>
        </div>

        <input type="text" id="mediaId" placeholder="IMDb ID (e.g. tt1375666)" value="tt1375666">
        <input type="number" id="seasonNum" placeholder="Season">
        <input type="number" id="episodeNum" placeholder="Ep">
        <button class="load-btn" onclick="launchStream()">Open Stream</button>
    </div>

    <div class="dashboard-content">
        <div class="card">
            <h2>Multi-Server Stream Control</h2>
            <p>Your control panel is safe and unlocked. Select any server from the dropdown, enter an IMDb ID (and Season/Episode if it's a TV series), and click <strong>Open Stream</strong> to launch the player instantly without sandbox errors or screen freezes!</p>
        </div>
    </div>

    <script>
        const servers = [
            (id, s, e) => s ? `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}` : `https://vidsrc.cc/v2/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.su/embed/tv/${id}/${s}/${e}` : `https://vidsrc.su/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidlink.pro/tv/${id}/${s}/${e}` : `https://vidlink.pro/movie/${id}`,
            (id, s, e) => `https://multiembed.mov/?video_id=${id}${s ? `&s=${s}&e=${e}` : ''}`,
            (id, s, e) => `https://player.autoembed.cc/embed/movie/${id}`,
            (id, s, e) => s ? `https://moviesapi.club/tv/${id}-${s}-${e}` : `https://moviesapi.club/movie/${id}`,
            (id, s, e) => `https://vidzee.za.com/embed/${id}`,
            (id, s, e) => s ? `https://www.2embed.stream/embed/tv/${id}/${s}/${e}` : `https://www.2embed.stream/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidfast.pro/embed/tv/${id}/${s}/${e}` : `https://vidfast.pro/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.me/embed/tv?imdb=${id}&s=${s}&e=${e}` : `https://vidsrc.me/embed/movie?imdb=${id}`,
            (id, s, e) => s ? `https://vidsrc.vip/embed/tv/${id}/${s}/${e}` : `https://vidsrc.vip/embed/movie/${id}`
        ];

        function launchStream() {
            const selectElement = document.getElementById('serverSelect');
            const serverIndex = parseInt(selectElement.value);
            const id = document.getElementById('mediaId').value.trim();
            const s = document.getElementById('seasonNum').value;
            const e = document.getElementById('episodeNum').value;

            if (!id) {
                alert("Please enter a valid IMDb ID!");
                return;
            }

            const targetUrl = servers[serverIndex](id, s, e);
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
