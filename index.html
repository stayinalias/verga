<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Server Streaming Platform</title>
    <style>
        :root {
            --bg-color: #0a0b0e;
            --panel-bg: #12141c;
            --dropdown-bg: #1a1d28;
            --border-color: #2a2e3d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            padding: 12px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
            max-width: 320px;
        }

        /* Dropdown selector matching your reference image */
        .server-select-wrapper {
            position: relative;
            display: inline-block;
        }

        select.server-dropdown {
            background: var(--dropdown-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 35px 9px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            transition: border-color 0.2s;
        }

        select.server-dropdown:hover {
            border-color: var(--accent);
        }

        /* Custom dropdown arrow icon */
        .server-select-wrapper::after {
            content: "▼";
            font-size: 10px;
            color: var(--text-muted);
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        button.load-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button.load-btn:hover {
            background: #2563eb;
        }

        .player-wrapper {
            flex: 1;
            background: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <!-- Dropdown Server Selector Menu -->
        <div class="server-select-wrapper">
            <select id="serverSelect" class="server-dropdown" onchange="updateStream()">
                <option value="0">Main 1 (VidSrc.cc)</option>
                <option value="1">Main 2 (VidSrc.to)</option>
                <option value="2">Main 3 (VidSrc.su)</option>
                <option value="3">Main 4 (VidLink)</option>
                <option value="4">Main 5 (MultiEmbed)</option>
                <option value="5">Main 6 (AutoEmbed)</option>
                <option value="6">Main 7 (MoviesAPI)</option>
                <option value="7">Main 8 (VidZee)</option>
                <option value="8">Main 9 (2Embed)</option>
                <option value="9">Main 10 (VidFast)</option>
                <option value="10">Multi-language (VidSrc Me)</option>
                <option value="11">Premium embeds (VidSrc VIP)</option>
            </select>
        </div>

        <input type="text" id="mediaId" placeholder="IMDb ID (e.g. tt1375666)" value="tt1375666">
        <input type="number" id="seasonNum" placeholder="Season" style="width: 80px; display: none;" onchange="updateStream()">
        <input type="number" id="episodeNum" placeholder="Ep" style="width: 65px; display: none;" onchange="updateStream()">
        <button class="load-btn" onclick="updateStream()">Load Stream</button>
    </div>

    <div class="player-wrapper">
        <iframe id="streamFrame" allowfullscreen></iframe>
    </div>

    <script>
        // 12+ Working streaming server endpoints matching your drop-down options
        const servers = [
            (id, s, e) => s ? `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}` : `https://vidsrc.cc/v2/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.su/embed/tv/${id}/${s}/${e}` : `https://vidsrc.su/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidlink.pro/tv/${id}/${s}/${e}` : `https://vidlink.pro/movie/${id}`,
            (id, s, e) => `https://multiembed.mov/?video_id=${id}${s ? `&s=${s}&e=${e}` : ''}`,
            (id, s, e) => `https://player.autoembed.cc/embed/movie/${id}`,
            (id, s, e) => s ? `https://moviesapi.club/tv/${id}-${s}-${e}` : `https://moviesapi.club/movie/${id}`,
            (id, s, e) => `https://vidzee.za.com/embed/${id}`,
            (id, s, e) => s ? `https://www.2embed.stream/embed/tv/${id}/${s}/${e}` : `https://www.2embed.stream/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidfast.pro/embed/tv/${id}/${s}/${e}` : `https://vidfast.pro/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.me/embed/tv?imdb=${id}&s=${s}&e=${e}` : `https://vidsrc.me/embed/movie?imdb=${id}`,
            (id, s, e) => s ? `https://vidsrc.vip/embed/tv/${id}/${s}/${e}` : `https://vidsrc.vip/embed/movie/${id}`
        ];

        function updateStream() {
            const selectElement = document.getElementById('serverSelect');
            const serverIndex = parseInt(selectElement.value);
            const id = document.getElementById('mediaId').value.trim();
            const s = document.getElementById('seasonNum').value;
            const e = document.getElementById('episodeNum').value;

            if (!id) return;

            // Generate source URL based on the selected dropdown index
            const targetUrl = servers[serverIndex](id, s, e);
            document.getElementById('streamFrame').src = targetUrl;
        }

        // Auto load default stream on startup
        updateStream();
    </script>
</body>
</html>
