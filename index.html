<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERGA - Stremio Multi-Stream Portal</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #151821;
            --border-color: #282d3c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Integrated Control Banner */
        .top-banner {
            height: 52px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            gap: 12px;
            z-index: 1000;
            flex-shrink: 0;
        }

        .brand {
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .brand span {
            color: var(--accent);
        }

        .quick-stream-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            max-width: 750px;
        }

        select, input, button {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        select {
            cursor: pointer;
            background-color: #1a1e2b;
            font-weight: 600;
        }

        input[type="text"] {
            width: 170px;
        }

        input[type="number"] {
            width: 60px;
        }

        button.btn-play {
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 700;
            padding: 7px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button.btn-play:hover {
            background: var(--accent-hover);
        }

        /* Stremio Portal Container */
        .portal-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 52px);
            position: relative;
        }

        iframe.stremio-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* In-App Sanitized Player View */
        .player-overlay {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .player-bar {
            height: 44px;
            background: #11131a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .close-player-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .close-player-btn:hover {
            background: #dc2626;
        }

        iframe.stream-frame {
            width: 100%;
            height: calc(100% - 44px);
            border: none;
        }
    </style>
</head>
<body>

    <!-- Control Banner Over Stremio Web -->
    <div class="top-banner">
        <div class="brand"><span>VERGA</span> STREMIO</div>
        
        <div class="quick-stream-bar">
            <select id="serverSelect">
                <option value="0">Server 1 (VidSrc.cc)</option>
                <option value="1">Server 2 (VidSrc.to)</option>
                <option value="2">Server 3 (VidSrc.su)</option>
                <option value="3">Server 4 (VidLink Pro)</option>
                <option value="4">Server 5 (MultiEmbed)</option>
                <option value="5">Server 6 (AutoEmbed)</option>
                <option value="6">Server 7 (MoviesAPI)</option>
                <option value="7">Server 8 (2Embed)</option>
                <option value="8">Server 9 (VidFast)</option>
                <option value="9">Server 10 (VidSrc VIP)</option>
            </select>

            <input type="text" id="imdbIdInput" placeholder="IMDb ID (tt1375666)" value="tt1375666">
            <input type="number" id="seasonInput" placeholder="Season" min="1">
            <input type="number" id="episodeInput" placeholder="Ep" min="1">

            <button class="btn-play" onclick="playInAppStream()">▶ Stream Now</button>
            <button class="btn-play" style="background:#282d3c;" onclick="loadInStremio()">🔍 Load in Stremio</button>
        </div>
    </div>

    <!-- Main View: Official Stremio Web UI -->
    <div class="portal-container">
        <iframe id="stremioFrame" class="stremio-frame" src="https://web.strem.io/#/" allowfullscreen></iframe>

        <!-- In-App Stream Player Overlay -->
        <div class="player-overlay" id="playerOverlay">
            <div class="player-bar">
                <span id="playerStatus" style="font-size: 13px; font-weight: 600;">Active Stream Player</span>
                <button class="close-player-btn" onclick="closeStreamPlayer()">✕ Close Player & Back to Catalog</button>
            </div>
            <!-- Player Frame Sandbox prevents external redirect hijacking -->
            <iframe id="streamPlayerFrame" class="stream-frame" allow="fullscreen; autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <script>
        const streamProviders = [
            (id, s, e) => s ? `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}` : `https://vidsrc.cc/v2/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.to/embed/tv/${id}/${s}/${e}` : `https://vidsrc.to/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.su/embed/tv/${id}/${s}/${e}` : `https://vidsrc.su/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidlink.pro/tv/${id}/${s}/${e}` : `https://vidlink.pro/movie/${id}`,
            (id, s, e) => `https://multiembed.mov/?video_id=${id}${s ? `&s=${s}&e=${e}` : ''}`,
            (id, s, e) => `https://player.autoembed.cc/embed/movie/${id}`,
            (id, s, e) => s ? `https://moviesapi.club/tv/${id}-${s}-${e}` : `https://moviesapi.club/movie/${id}`,
            (id, s, e) => s ? `https://www.2embed.stream/embed/tv/${id}/${s}/${e}` : `https://www.2embed.stream/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidfast.pro/embed/tv/${id}/${s}/${e}` : `https://vidfast.pro/embed/movie/${id}`,
            (id, s, e) => s ? `https://vidsrc.vip/embed/tv/${id}/${s}/${e}` : `https://vidsrc.vip/embed/movie/${id}`
        ];

        // Resolves IMDb IDs directly into Stremio's internal deep-link routing
        function loadInStremio() {
            const rawId = document.getElementById('imdbIdInput').value.trim();
            if (!rawId) {
                alert("Please enter a valid IMDb ID (e.g., tt1375666)");
                return;
            }

            const formattedId = rawId.startsWith('tt') ? rawId : `tt${rawId}`;
            const season = document.getElementById('seasonInput').value;
            const episode = document.getElementById('episodeInput').value;

            let stremioUrl = "";
            if (season && episode) {
                stremioUrl = `https://web.strem.io/#/detail/series/${formattedId}/${formattedId}%3A${season}%3A${episode}`;
            } else {
                stremioUrl = `https://web.strem.io/#/detail/movie/${formattedId}/${formattedId}`;
            }

            document.getElementById('stremioFrame').src = stremioUrl;
        }

        // Plays stream directly inside an in-app layer over your dashboard (no new tabs or window locks)
        function playInAppStream() {
            const rawId = document.getElementById('imdbIdInput').value.trim();
            if (!rawId) {
                alert("Please enter a valid IMDb ID");
                return;
            }

            const formattedId = rawId.startsWith('tt') ? rawId : `tt${rawId}`;
            const serverIdx = parseInt(document.getElementById('serverSelect').value);
            const season = document.getElementById('seasonInput').value;
            const episode = document.getElementById('episodeInput').value;

            const targetUrl = streamProviders[serverIdx](formattedId, season, episode);

            document.getElementById('playerStatus').innerText = `Streaming ${formattedId} on Server ${serverIdx + 1}`;
            document.getElementById('streamPlayerFrame').src = targetUrl;
            document.getElementById('playerOverlay').style.display = 'flex';
        }

        function closeStreamPlayer() {
            document.getElementById('streamPlayerFrame').src = 'about:blank';
            document.getElementById('playerOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
